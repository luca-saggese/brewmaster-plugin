nome: "Sierra Nevada Pale Ale clone"
stile: "American Pale Ale"
codice_bjcp: "18B"
descrizione: |
  Clone del celebre pale ale di Sierra Nevada, con profilo pulito, corpo medio e
  luppolatura Cascade aromatica e agrumata.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/sierra-nevada-pale-ale-clone/"
  autore: "BYO Staff"
  verifica: "Clone commerciale pubblicato da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.053
  fg: 1.011
  abv_percent: 5.6
  ibu: 37
  ebc: 20
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "2-row pale malt"
    kg: 4.7
    percent: 91.3
    note: "Malto base"
  - malto: "Crystal 60L"
    kg: 0.45
    percent: 8.7
    note: "Caramello"

luppolatura:
  - varieta: "Magnum"
    grammi: 14
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "Perle"
    grammi: 14
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "Cascade"
    grammi: 57
    tempo_min: 30
    uso: boil
    note: "Sapore"
  - varieta: "Cascade"
    grammi: 57
    tempo_min: 0
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "Wyeast 1056 / White Labs WLP001 / Safale US-05"
  forma: liquido
  attenuazione_percent: 76
  temperatura_fermentazione: "20°C"
  note: "Lievito ale americano pulito"

mash:
  temperatura_c: 68
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 7
  temperatura_c: 20
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.5
  temperatura_servizio_c: 5

note_critiche:
  - "Luppolatura Cascade aromatica"
  - "Profilo pulito e bilanciato"

alternative:
  - descrizione: "Versione più luppolata"
    cambiamenti: "Aggiungere dry hop Cascade"
    impatto: "Aroma più intenso"
