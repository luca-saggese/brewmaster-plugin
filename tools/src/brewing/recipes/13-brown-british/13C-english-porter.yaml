nome: "Gordon Strong's English Porter"
stile: "English Porter"
codice_bjcp: "13C"
descrizione: |
  Porter inglese con brown malt come componente di sapore e Munich per corpo
  maltato senza dolcezza residua.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/gordon-strongs-english-porter/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.053
  fg: 1.015
  abv_percent: 4.9
  ibu: 28
  ebc: 59
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Pale ale malt UK"
    kg: 3.2
    percent: 63
    note: "Malto base"
  - malto: "Brown malt UK"
    kg: 0.57
    percent: 11
    note: "Tostatura"
  - malto: "Crystal UK (60°L)"
    kg: 0.57
    percent: 11
    note: "Caramello"
  - malto: "Munich"
    kg: 0.45
    percent: 9
    note: "Corpo maltato"
  - malto: "Chocolate malt UK"
    kg: 0.283
    percent: 6
    note: "Tostatura"

luppolatura:
  - varieta: "Fuggle"
    grammi: 43
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "Goldings"
    grammi: 14
    tempo_min: 10
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "Wyeast 1968 / WLP002 / LalBrew Windsor"
  forma: liquido
  attenuazione_percent: 72
  temperatura_fermentazione: "19°C"
  note: "Lievito ale inglese"

mash:
  temperatura_c: 67
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 7
  temperatura_c: 19
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.3
  temperatura_servizio_c: 8

note_critiche:
  - "Brown malt per sapore caratteristico"
  - "Munich per corpo senza dolcezza"

alternative:
  - descrizione: "Versione più scura"
    cambiamenti: "Aumentare chocolate malt"
    impatto: "Tostatura più decisa"
