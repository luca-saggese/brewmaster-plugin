nome: "Gordon Strong's Oatmeal Stout"
stile: "Oatmeal Stout"
codice_bjcp: "16B"
descrizione: |
  Oatmeal stout più corposa delle versioni inglesi, con avena in fiocchi per
  morbidezza e profilo tostato bilanciato.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/gordon-strongs-oatmeal-stout/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.063
  fg: 1.018
  abv_percent: 6.0
  ibu: 25
  ebc: 83
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Pale ale malt"
    kg: 4.5
    percent: 75
    note: "Malto base"
  - malto: "Fiocchi d'avena"
    kg: 0.567
    percent: 9
    note: "Corpo morbido"
  - malto: "Crystal (80°L)"
    kg: 0.34
    percent: 6
    note: "Caramello"
  - malto: "Chocolate malt (450°L)"
    kg: 0.283
    percent: 5
    note: "Tostatura"
  - malto: "Orzo tostato (550°L)"
    kg: 0.227
    percent: 4
    note: "Tostatura"
  - malto: "Crystal (40°L)"
    kg: 0.113
    percent: 2
    note: "Caramello"

luppolatura:
  - varieta: "UK Golding"
    grammi: 21
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "UK Golding"
    grammi: 21
    tempo_min: 30
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "Wyeast 1318 (London Ale III) / Imperial A38 / WLP066 / LalBrew New England"
  forma: liquido
  attenuazione_percent: 74
  temperatura_fermentazione: "18°C"
  note: "Lievito ale inglese"

mash:
  temperatura_c: 68
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 7
  temperatura_c: 18
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.3
  temperatura_servizio_c: 7

note_critiche:
  - "Avena in fiocchi per morbidezza"
  - "Profilo tostato bilanciato"

alternative:
  - descrizione: "Versione più corposa"
    cambiamenti: "Aumentare avena a 12%"
    impatto: "Corpo più morbido"
