nome: "Gordon Strong's Belgian Pale Ale"
stile: "Belgian Pale Ale"
codice_bjcp: "24B"
descrizione: |
  Belgian pale ale ambrata e maltata con carattere di lievito belga fruttato-speziato
  e luppolo nobile Saaz.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/gordon-strongs-belgian-pale-ale/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.047
  fg: 1.010
  abv_percent: 5.0
  ibu: 25
  ebc: 24
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Pilsner malt"
    kg: 2.72
    percent: 62
    note: "Malto base"
  - malto: "Vienna malt"
    kg: 1.13
    percent: 26
    note: "Corpo maltato"
  - malto: "Aromatic malt"
    kg: 0.23
    percent: 5
    note: "Aroma maltato"
  - malto: "Caramunich III / crystal (80°L)"
    kg: 0.23
    percent: 5
    note: "Caramello"
  - malto: "Biscuit malt"
    kg: 0.17
    percent: 4
    note: "Tostatura"
  - malto: "Debittered black malt"
    kg: 0.01
    percent: 1
    note: "Colore"

luppolatura:
  - varieta: "Saaz"
    grammi: 28
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "Saaz"
    grammi: 14
    tempo_min: 10
    uso: boil
    note: "Aroma"
  - varieta: "Saaz"
    grammi: 14
    tempo_min: 2
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "White Labs WLP515 (Antwerp Ale) / Wyeast 3655 / SafAle S-33"
  forma: liquido
  attenuazione_percent: 76
  temperatura_fermentazione: "18°C"
  note: "Lievito belga, free rise max 25°C"

mash:
  temperatura_c: 66
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 10
  temperatura_c: 18
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.6
  temperatura_servizio_c: 6

note_critiche:
  - "Lievito belga per carattere fruttato-speziato"
  - "Luppolo nobile Saaz"

alternative:
  - descrizione: "Versione più maltata"
    cambiamenti: "Aumentare Vienna"
    impatto: "Corpo più pieno"
