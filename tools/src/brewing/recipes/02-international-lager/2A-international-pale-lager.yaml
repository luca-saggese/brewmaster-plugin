nome: "Mexican Lager"
stile: "International Pale Lager"
codice_bjcp: "2A"
descrizione: |
  Mexican lager pulita e croccante con Vienna e mais in fiocchi, bassa amarezza
  e profilo molto attenuato.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/mexican-lager/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.049
  fg: 1.011
  abv_percent: 5.0
  ibu: 19
  ebc: 7
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Pilsner tedesco"
    kg: 1.6
    percent: 34.1
    note: "Malto base"
  - malto: "2-row USA"
    kg: 0.91
    percent: 19.5
    note: "Malto base"
  - malto: "Vienna tedesco"
    kg: 0.91
    percent: 19.5
    note: "Corpo maltato"
  - malto: "Mais in fiocchi"
    kg: 1.25
    percent: 26.8
    note: "Secchezza"

luppolatura:
  - varieta: "Tettnanger"
    grammi: 9
    tempo_min: 0
    uso: first_wort
  - varieta: "Tettnanger"
    grammi: 19
    tempo_min: 45
    uso: boil
  - varieta: "Tettnanger"
    grammi: 14
    tempo_min: 5
    uso: boil

lievito:
  ceppo: "White Labs WLP940 (Mexican Lager) / Lallemand Diamond Lager"
  forma: liquido
  attenuazione_percent: 75
  temperatura_fermentazione: "10°C"
  note: "Lievito lager pulito"

mash:
  temperatura_c: 65
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 14
  temperatura_c: 10
  cold_crash: true
  cold_crash_giorni: 3
  cold_crash_temp_c: 0
  note: "Lagering 4-8 settimane a 0°C"

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.5
  temperatura_servizio_c: 4

note_critiche:
  - "Lagering lungo per profilo pulito"
  - "Vienna per corpo maltato senza dolcezza"

alternative:
  - descrizione: "Versione più secca"
    cambiamenti: "Aumentare il mais in fiocchi"
    impatto: "Corpo più leggero"
