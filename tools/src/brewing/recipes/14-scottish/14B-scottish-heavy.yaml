nome: "Scottish 70/- Heavy"
stile: "Scottish Heavy"
codice_bjcp: "14B"
descrizione: |
  Scottish heavy maltato e morbido, con luppolatura minima e lievito scozzese
  pulito.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/scottish-70-heavy/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.035
  fg: 1.012
  abv_percent: 3.0
  ibu: 13
  ebc: 26
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Golden Promise"
    kg: 2.7
    percent: 89
    note: "Malto base"
  - malto: "Flaked barley"
    kg: 0.17
    percent: 6
    note: "Corpo"
  - malto: "Caramunich II"
    kg: 0.085
    percent: 3
    note: "Caramello"
  - malto: "Pale chocolate"
    kg: 0.043
    percent: 1
    note: "Tostatura"
  - malto: "Roasted barley"
    kg: 0.043
    percent: 1
    note: "Colore"

luppolatura:
  - varieta: "Fuggle"
    grammi: 14
    tempo_min: 60
    uso: boil
    note: "Amaro"

lievito:
  ceppo: "White Labs WLP028 / Wyeast 1728 / SafAle US-05"
  forma: liquido
  attenuazione_percent: 74
  temperatura_fermentazione: "15°C"
  note: "Lievito scozzese"

mash:
  temperatura_c: 70
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 7
  temperatura_c: 15
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.3
  temperatura_servizio_c: 7

note_critiche:
  - "Luppolatura minima"
  - "Lievito scozzese pulito"

alternative:
  - descrizione: "Versione più maltata"
    cambiamenti: "Aumentare Caramunich"
    impatto: "Caramello più deciso"
