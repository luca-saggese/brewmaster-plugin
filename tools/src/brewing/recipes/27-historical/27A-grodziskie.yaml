nome: "Piwo Grodziskie Oryginalne"
stile: "Grodziskie (Grätzer)"
codice_bjcp: "27A"
descrizione: |
  Birra chiara, secca e amara (28 IBU su soli 3.1% ABV), con strati di fumo da
  falò e delicato aroma di luppolo nobile; fermentazione pulita per non coprire
  il fumo. Soprannominata "champagne polacco" per l'altissima effervescenza.

fonte:
  nome: "Craft Beer & Brewing Magazine"
  url: "https://beerandbrewing.com/recipe-piwo-grodziskie-oryginalne"
  autore: "Marcin Ostajewski (Browar Grodzisk)"
  verifica: "Ricetta pubblicata da Craft Beer & Brewing, fonte autorevole. Quantità esatte grist/luppoli dietro paywall; composizione 100% frumento affumicato verificata dall'articolo correlato."

parametri:
  batch_size_litri: 19
  og: 1.031
  fg: 1.007
  abv_percent: 3.1
  ibu: 28
  ebc: 5
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Malto di frumento affumicato (oak-smoked wheat malt)"
    kg: 4.0
    percent: 100
    note: "Frumento affumicato"

luppolatura:
  - varieta: "Tomyski / Lubelski (Lublin)"
    grammi: 30
    tempo_min: 60
    uso: boil
    note: "Luppoli nobili erbacei"

lievito:
  ceppo: "White Labs WLP548 (ceppo originale di Grodzisk) o lievito lager neutro"
  forma: liquido
  attenuazione_percent: 78
  temperatura_fermentazione: "12°C"
  note: "Fermentazione fredda"

mash:
  temperatura_c: 65
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Decozione opzionale"

bollitura:
  durata_min: 90
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 14
  temperatura_c: 12
  cold_crash: true
  cold_crash_giorni: 3
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 3.8
  temperatura_servizio_c: 4

note_critiche:
  - "Carbonazione molto alta (3.5-4 vol CO2)"
  - "Fermentazione pulita per non coprire il fumo"

alternative:
  - descrizione: "Versione meno affumicata"
    cambiamenti: "Mescolare con frumento non affumicato"
    impatto: "Fumo più contenuto"
