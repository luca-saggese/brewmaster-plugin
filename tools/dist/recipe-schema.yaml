version: 1

canonical_fields:
  - versione_ricetta
  - changelog
  - nome
  - stile
  - descrizione
  - parametri
  - grist
  - luppolatura
  - aggiunte_speciali
  - lievito
  - acqua
  - mash_salts
  - sparge_salts
  - mash
  - bollitura
  - fermentazione
  - carbonazione
  - note_critiche
  - alternative

validator:
  accepted_top_level_fields:
    - schema_version
    - versione_ricetta
    - changelog
    - nome
    - stile
    - codice_bjcp
    - descrizione
    - note
    - parametri
    - grist
    - luppolatura
    - aggiunte_speciali
    - lievito
    - mash
    - fermentazione
    - bollitura
    - acqua
    - agua
    - sparge
    - sales
    - mash_salts
    - sparge_salts
    - carbonazione
    - spezie
    - zuccheri
    - confezionamento
    - obiettivi_sensoriali
    - vincoli_produzione
    - fonte
    - note_critiche
    - alternative
  required_string_fields:
    - nome
    - stile
  required_numeric_parameters:
    batch_size_litri: positive
    og: positive
    fg: positive
    ibu: non_negative
  recipe_history:
    version_field: versione_ricetta
    changelog_field: changelog
    entry_fields:
      versione: positive_integer
      data: iso_date
      modifica: non_empty_string
  numeric_parameter_fields:
    - batch_size_litri
    - og
    - fg
    - ibu
    - ebc
    - abv_percent
    - efficienza_percent
    - bollitura_min
    - pre_boil_litri
    - post_boil_litri
    - fermentatore_litri
    - volume_fermentatore
    - confezionamento_litri
    - carbonazione_vol
    - priming_gl
  list_fields:
    - grist
    - luppolatura
    - aggiunte_speciali
    - spezie
    - zuccheri
  salt_sections:
    - mash_salts
    - sparge_salts
  salt_fields:
    - gypsum_g
    - cacl2_g
    - epsom_g
    - nahco3_g
    - lactic_acid_ml
  recipe_fields:
    bollitura:
      durata_min:
        type: number
        required: true
        min: 1
        aliases: [duration_min, duracion_min]
      volume_pre_boil_litri:
        type: number
        required: true
        min: 0
        exclusive_min: true
        aliases: [pre_boil_litri, volumen_pre_boil_litri]
      volume_post_boil_litri:
        type: number
        required: true
        min: 0
        exclusive_min: true
        aliases: [post_boil_litri, volumen_post_boil_litri]
      og_pre_boil:
        type: number
        required: true
        min: 1
        exclusive_min: true
        aliases: [gravedad_pre_boil, pre_boil_og]
      og_post_boil:
        type: number
        required: true
        min: 1
        exclusive_min: true
        aliases: [gravedad_post_boil, post_boil_og]
      evaporazione_litri:
        type: number
        required: true
        min: 0
        aliases: [perdita_evaporazione_litri]
      perdita_trub_litri:
        type: number
        required: true
        min: 0
      irish_moss:
        type: boolean
        required: true
      whirlpool:
        type: boolean
        required: true
      whirlpool_temp_c:
        type: number
        required_if: { field: whirlpool, equals: true }
        min: 0
        max: 100
        aliases: [whirlpool_temperatura_c, hop_stand_temperatura_c]
      whirlpool_durata_min:
        type: number
        required_if: { field: whirlpool, equals: true }
        min: 0
        exclusive_min: true
    fermentazione:
      steps:
        type: array
        required: true
        min_items: 1
      step_fields:
        fase:
          type: string
          required: true
          non_empty: true
          aliases: [phase]
        giorno_inizio:
          type: number
          required: true
          min: 0
          aliases: [start_day]
        giorno_fine:
          type: number
          required: true
          min: 0
          aliases: [end_day]
        temperatura_c:
          type: number
          required: false
          min: 0
          max: 60
          aliases: [temperature_c]
        temperatura_min_c:
          type: number
          required: false
          min: 0
          max: 60
          aliases: [temperature_min_c]
        temperatura_max_c:
          type: number
          required: false
          min: 0
          max: 60
          aliases: [temperature_max_c]
        note:
          type: string
          required: false
      required_one_of:
        - [temperatura_c]
        - [temperatura_min_c, temperatura_max_c]
  special_additions:
    required_string_fields:
      - ingrediente
      - forma
      - stadio
    required_positive_number_fields:
      - quantita_kg
    optional_number_fields:
      - equivalente_fresco_kg
      - equivalente_fresco_g_l
      - dose_min_kg
      - dose_max_kg
      - zuccheri_stimati_g
      - acqua_stimata_l
    optional_string_fields:
      - giorni_contatto
      - preparazione
      - note
      - intensita_calcolata

canonical_example: |
  versione_ricetta: 1
  changelog:
    - versione: 1
      data: "2026-10-05"
      modifica: "Versione iniziale della ricetta"

  nome: "Nome della ricetta"
  stile: "BJCP 21A — American IPA"
  descrizione: |
    Descrizione sensoriale e stilistica della ricetta.

  parametri:
    batch_size_litri: 23
    og: 1.065
    fg: 1.012
    abv_percent: 6.8
    ibu: 55
    ebc: 18
    efficienza_percent: 75
    impianto: "BrewZilla 35L"
    volume_fermentatore: 23
    confezionamento_litri: 22

  grist:
    - malto: "Pale Ale Malt"
      kg: 4.5
      percent: 75.0
      note: "Malto base"
    - malto: "Munich Light"
      kg: 0.8
      percent: 13.3
      note: "Corpo e colore"

  luppolatura:
    - varieta: "Magnum"
      grammi: 20
      tempo_min: 60
      uso: boil
      aa_percent: 13.0
      ibu_stimati: 25
    - varieta: "Citra"
      grammi: 30
      tempo_min: 5
      uso: boil
      aa_percent: 12.0
      ibu_stimati: 5

  aggiunte_speciali:
    - ingrediente: "Uva fragolino (Isabella)"
      quantita_kg: 4
      forma: "fresca intera, pigiata"
      stadio: "primario, a fine fermentazione primaria"
      giorni_contatto: "7-10"
      preparazione: "Congelare, scongelare, pigiare e aggiungere in sacchetto sanitizzato."
      note: "Verificare FG stabile dopo la fermentazione degli zuccheri della frutta."

  lievito:
    ceppo: "SafAle US-05"
    forma: secco
    attenuazione_percent: 80
    temperatura_fermentazione: "18-20°C"
    note: "Neutro, lascia spazio al luppolo"

  acqua:
    sparge_litri: 10
    total_litri: 28
    ca_mg_l: 110
    mg_mg_l: 18
    na_mg_l: 16
    cl_mg_l: 60
    so4_mg_l: 275
    hco3_mg_l: 50
    rapporto_so4_cl: 4.6
    ph_target: 5.4
    note: "Profilo coerente con l'obiettivo sensoriale"

  mash_salts:
    gypsum_g: 3.2
    cacl2_g: 2.4
    epsom_g: 0.8
    nahco3_g: 0.3
    lactic_acid_ml: 1.5

  sparge_salts:
    gypsum_g: 1.6
    cacl2_g: 1.2
    epsom_g: 0.4
    nahco3_g: 0.15

  mash:
    temperatura_c: 65
    durata_min: 60
    spessore_l_kg: 3.0
    acqua_strike_litri: 18.0
    temperatura_strike_c: 72
    note: "Single infusion"

  bollitura:
    durata_min: 60
    volume_pre_boil_litri: 28
    volume_post_boil_litri: 23
    og_pre_boil: 1.050
    og_post_boil: 1.065
    evaporazione_litri: 5
    perdita_trub_litri: 0.5
    irish_moss: true
    whirlpool: true
    whirlpool_temp_c: 80
    whirlpool_durata_min: 20

  fermentazione:
    primaria_giorni: 7
    temperatura_c: 19
    steps:
      - fase: "Avvio"
        giorno_inizio: 0
        giorno_fine: 3
        temperatura_c: 19
      - fase: "Rampa libera"
        giorno_inizio: 3
        giorno_fine: 7
        temperatura_min_c: 21
        temperatura_max_c: 24
        note: "Lasciare salire gradualmente"
    dry_hop_giorno: 5
    dry_hop_temperatura_c: 19
    cold_crash: true
    cold_crash_giorni: 2
    cold_crash_temp_c: 2

  carbonazione:
    metodo: bottiglia
    tipo_botella: "Long neck"
    zucchero_tipo: saccarosio
    zucchero_grammi: 130
    zucchero_g_per_litro: 6.5
    co2_volumi: 2.4
    temperatura_servizio_c: 6

  note_critiche:
    - "Nota critica di processo"

  alternative:
    - descrizione: "Alternativa"
      cambiamenti: "Cosa cambia"
      impatto: "Impatto tecnico e sensoriale"