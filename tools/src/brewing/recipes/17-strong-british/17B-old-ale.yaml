nome: "Gordon Strong's Old Ale"
stile: "Old Ale"
codice_bjcp: "17B"
descrizione: |
  Old ale forte e maltata con zucchero invertito, da bere giovane o da invecchiare
  6+ mesi.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/gordon-strongs-old-ale/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.075
  fg: 1.015
  abv_percent: 8.0
  ibu: 40
  ebc: 41
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Maris Otter"
    kg: 4.5
    percent: 78
    note: "Malto base"
  - malto: "Dark Munich"
    kg: 1.0
    percent: 17
    note: "Corpo maltato"
  - malto: "CaraPils"
    kg: 0.227
    percent: 4
    note: "Schiuma e corpo"
  - malto: "Chocolate malt"
    kg: 0.057
    percent: 1
    note: "Colore"

luppolatura:
  - varieta: "Styrian Golding"
    grammi: 57
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "First Gold"
    grammi: 28
    tempo_min: 5
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "Wyeast 1469 (West Yorkshire Ale) / WLP037 / SafAle S-04"
  forma: liquido
  attenuazione_percent: 75
  temperatura_fermentazione: "20°C"
  note: "Lievito ale inglese"

mash:
  temperatura_c: 68
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 10
  temperatura_c: 20
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.3
  temperatura_servizio_c: 8

note_critiche:
  - "Zucchero invertito (Invert #3 / candi D-90) 907g per attenuazione"
  - "Da bere giovane o invecchiare 6+ mesi"

alternative:
  - descrizione: "Versione più dolce"
    cambiamenti: "Ridurre lo zucchero invertito"
    impatto: "Finale più dolce"
