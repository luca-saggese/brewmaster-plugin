nome: "Gordon Strong's Belgian Dubbel"
stile: "Belgian Dubbel"
codice_bjcp: "26B"
descrizione: |
  Dubbel ambrata e maltata con note di frutta secca e caramello dallo zucchero
  candito, esteri fruttati e finale secco.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/gordon-strongs-belgian-dubbel/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.066
  fg: 1.012
  abv_percent: 7.0
  ibu: 22
  ebc: 34
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Belgian Pilsner malt"
    kg: 3.49
    percent: 42
    note: "Malto base"
  - malto: "German Munich malt"
    kg: 0.45
    percent: 5
    note: "Corpo maltato"
  - malto: "German dark Munich malt"
    kg: 0.91
    percent: 11
    note: "Profondità"
  - malto: "CaraPils malt"
    kg: 0.11
    percent: 1
    note: "Schiuma e corpo"
  - malto: "Amber (D-45) candi syrup"
    kg: 0.45
    percent: 5
    note: "Attenuazione"
  - malto: "Dark (D-90) candi syrup"
    kg: 0.45
    percent: 5
    note: "Caramello scuro"

luppolatura:
  - varieta: "Styrian Goldings"
    grammi: 43
    tempo_min: 60
    uso: boil
    note: "Amaro"
  - varieta: "Saaz"
    grammi: 14
    tempo_min: 15
    uso: boil
    note: "Aroma"
  - varieta: "Saaz"
    grammi: 14
    tempo_min: 2
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "Wyeast 3787 / WLP530 / Imperial B48 / LalBrew Abbaye"
  forma: liquido
  attenuazione_percent: 80
  temperatura_fermentazione: "18°C"
  note: "Lievito trappista, free rise"

mash:
  temperatura_c: 65
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 10
  temperatura_c: 18
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.6
  temperatura_servizio_c: 6

note_critiche:
  - "Zucchero candito per caramello e attenuazione"
  - "Lievito trappista per esteri fruttati"

alternative:
  - descrizione: "Versione più scura"
    cambiamenti: "Aumentare D-90 candi syrup"
    impatto: "Caramello più scuro"
