nome: "Mike McDole's Double IPA"
stile: "Double IPA (Imperial IPA)"
codice_bjcp: "22A"
descrizione: |
  Double IPA da 10% ABV con mash hopping e luppolatura massiccia di
  Chinook/Warrior/Simcoe/Columbus, corpo pieno e amaro intenso.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/mike-mcdoles-double-ipa/"
  autore: "Mike McDole"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.095
  fg: 1.020
  abv_percent: 10.0
  ibu: 100
  ebc: 15
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "American 2-row malt"
    kg: 7.3
    percent: 86.5
    note: "Malto base"
  - malto: "Briess Cara-Pils 2L"
    kg: 0.45
    percent: 5.3
    note: "Schiuma e corpo"
  - malto: "Corn sugar"
    kg: 0.23
    percent: 2.7
    note: "Attenuazione"
  - malto: "Crystal 40L"
    kg: 0.23
    percent: 2.7
    note: "Caramello"
  - malto: "Wheat malt"
    kg: 0.23
    percent: 2.7
    note: "Corpo"

luppolatura:
  - varieta: "Chinook"
    grammi: 21
    tempo_min: 0
    uso: mash
    note: "Mash hop"
  - varieta: "Warrior"
    grammi: 43
    tempo_min: 90
    uso: boil
    note: "Amaro"
  - varieta: "Chinook"
    grammi: 28
    tempo_min: 90
    uso: boil
    note: "Amaro"
  - varieta: "Simcoe"
    grammi: 21
    tempo_min: 45
    uso: boil
    note: "Sapore"
  - varieta: "Columbus"
    grammi: 21
    tempo_min: 0
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "Ceppo ale americano pulito (es. US-05 / WLP001)"
  forma: secco
  attenuazione_percent: 78
  temperatura_fermentazione: "20°C"
  note: "Lievito ale americano, poi salita a 22°C"

mash:
  temperatura_c: 67
  durata_min: 45
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 90
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 14
  temperatura_c: 20
  cold_crash: true
  cold_crash_giorni: 3
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.5
  temperatura_servizio_c: 5

note_critiche:
  - "Mash hopping per amaro complesso"
  - "Alta gravità, pitch rate elevato"

alternative:
  - descrizione: "Versione meno amara"
    cambiamenti: "Ridurre IBU a 80"
    impatto: "Più bilanciata"
