nome: "Gordon Strong's Leichtbier"
stile: "German Leichtbier"
codice_bjcp: "5A"
descrizione: |
  Leichtbier a bassa gradazione ma pieno di sapore, con luppolatura Hallertauer
  e corpo sostenuto da Carahell.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/gordon-strongs-leichtbier/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.032
  fg: 1.008
  abv_percent: 3.1
  ibu: 23
  ebc: 6
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Pilsner malt"
    kg: 2.7
    percent: 92
    note: "Malto base"
  - malto: "Carahell malt"
    kg: 0.23
    percent: 8
    note: "Corpo"

luppolatura:
  - varieta: "German Hallertauer"
    grammi: 35
    tempo_min: 0
    uso: first_wort
    note: "Amaro"
  - varieta: "German Hallertauer"
    grammi: 21
    tempo_min: 5
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "White Labs WLP833 / Wyeast 2633 / SafLager S-23"
  forma: liquido
  attenuazione_percent: 76
  temperatura_fermentazione: "10°C"
  note: "Lievito lager"

mash:
  temperatura_c: 65
  durata_min: 75
  spessore_l_kg: 3.0
  note: "Step: 63°C/60, 71°C/15, mashout 76°C"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 14
  temperatura_c: 10
  cold_crash: true
  cold_crash_giorni: 3
  cold_crash_temp_c: 0

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.5
  temperatura_servizio_c: 4

note_critiche:
  - "Bassa gradazione ma pieno di sapore"
  - "Carahell per corpo"

alternative:
  - descrizione: "Versione più secca"
    cambiamenti: "Ridurre Carahell"
    impatto: "Corpo più leggero"
