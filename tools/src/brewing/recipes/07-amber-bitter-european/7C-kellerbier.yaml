nome: "Kellerbier"
stile: "Kellerbier"
codice_bjcp: "7C"
descrizione: |
  Kellerbier francone non filtrato, maltato e paneoso, con luppolatura Perle
  pulita e carbonazione morbida.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/kellerbier/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.051
  fg: 1.013
  abv_percent: 5.0
  ibu: 18
  ebc: 10
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "German Pilsner malt"
    kg: 3.5
    percent: 73
    note: "Malto base"
  - malto: "German Vienna malt"
    kg: 0.54
    percent: 11
    note: "Corpo maltato"
  - malto: "Bestmalz caramel Pils malt (2°L)"
    kg: 0.54
    percent: 11
    note: "Corpo"
  - malto: "Biscuit malt"
    kg: 0.2
    percent: 4
    note: "Tostatura"

luppolatura:
  - varieta: "Perle"
    grammi: 6
    tempo_min: 0
    uso: first_wort
    note: "Amaro"
  - varieta: "Perle"
    grammi: 11
    tempo_min: 80
    uso: boil
    note: "Amaro"
  - varieta: "Saaz"
    grammi: 11
    tempo_min: 0
    uso: boil
    note: "Aroma"

lievito:
  ceppo: "SafLager W-34/70 / Wyeast 2124 / White Labs WLP830"
  forma: secco
  attenuazione_percent: 76
  temperatura_fermentazione: "9°C"
  note: "Lievito lager"

mash:
  temperatura_c: 65
  durata_min: 70
  spessore_l_kg: 3.0
  note: "Step: 52°C/10, 63°C/40, 72°C/20, mashout 78°C"

bollitura:
  durata_min: 80
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 14
  temperatura_c: 9
  cold_crash: true
  cold_crash_giorni: 3
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.3
  temperatura_servizio_c: 5

note_critiche:
  - "Non filtrato, carbonazione morbida"
  - "Profilo maltato e paneoso"

alternative:
  - descrizione: "Versione più luppolata"
    cambiamenti: "Aumentare IBU a 25"
    impatto: "Più amara"
