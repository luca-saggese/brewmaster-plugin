nome: "Gordon Strong's German Gose"
stile: "Gose"
codice_bjcp: "23G"
descrizione: |
  Gose tedesca leggermente acida e salata, con coriandolo, molto rinfrescante e
  a bassa gradazione.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/german-gose/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.042
  fg: 1.008
  abv_percent: 4.5
  ibu: 9
  ebc: 6
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "German wheat malt"
    kg: 2.27
    percent: 58
    note: "Frumento"
  - malto: "Belgian Pilsner malt"
    kg: 1.59
    percent: 42
    note: "Malto base"

luppolatura:
  - varieta: "Czech Saaz"
    grammi: 20
    tempo_min: 0
    uso: first_wort

lievito:
  ceppo: "Wyeast 1007 (German Ale) / WLP029; acidificazione con L. plantarum"
  forma: liquido
  attenuazione_percent: 78
  temperatura_fermentazione: "18°C"
  note: "Acidificazione con L. plantarum"

mash:
  temperatura_c: 65
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 10
  temperatura_c: 18
  cold_crash: true
  cold_crash_giorni: 2
  cold_crash_temp_c: 2

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 3.0
  temperatura_servizio_c: 4

note_critiche:
  - "Coriandolo 7.5g e sale kosher 10g a 0 min"
  - "Acidità lattica leggera"

alternative:
  - descrizione: "Versione più salata"
    cambiamenti: "Aumentare il sale"
    impatto: "Salinità più marcata"
