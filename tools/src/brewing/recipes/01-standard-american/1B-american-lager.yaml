nome: "Dad's American Lager"
stile: "American Lager"
codice_bjcp: "1B"
descrizione: |
  American lager pulita e bilanciata, base di 6-row/2-row con mais e riso.
  Punto di partenza versatile per molte varianti.

fonte:
  nome: "Brew Your Own (BYO) magazine"
  url: "https://byo.com/recipes/dads-american-lager/"
  autore: "Gordon Strong"
  verifica: "Ricetta pubblicata da BYO, fonte autorevole. Non verificata come premiata."

parametri:
  batch_size_litri: 19
  og: 1.046
  fg: 1.009
  abv_percent: 4.8
  ibu: 16
  ebc: 7
  efficienza_percent: 75
  impianto: "All grain 19L"
  volume_fermentatore: 19

grist:
  - malto: "Pale 6-row"
    kg: 1.8
    percent: 40
    note: "Malto base"
  - malto: "Pale 2-row"
    kg: 1.8
    percent: 40
    note: "Malto base"
  - malto: "Mais in fiocchi"
    kg: 0.45
    percent: 10
    note: "Secchezza"
  - malto: "Riso in fiocchi"
    kg: 0.45
    percent: 10
    note: "Secchezza"

luppolatura:
  - varieta: "Hallertauer"
    grammi: 28
    tempo_min: 60
    uso: boil

lievito:
  ceppo: "White Labs WLP940 (Mexican Lager) / SafLager W-34/70"
  forma: liquido
  attenuazione_percent: 75
  temperatura_fermentazione: "10°C"
  note: "Lievito lager pulito"

mash:
  temperatura_c: 65
  durata_min: 60
  spessore_l_kg: 3.0
  note: "Single infusion"

bollitura:
  durata_min: 60
  volume_pre_boil_litri: 24
  volume_post_boil_litri: 19

fermentazione:
  primaria_giorni: 14
  temperatura_c: 10
  cold_crash: true
  cold_crash_giorni: 3
  cold_crash_temp_c: 0
  note: "Lagering 6-8 settimane a 0°C"

carbonazione:
  metodo: bottiglia
  zucchero_tipo: saccarosio
  co2_volumi: 2.5
  temperatura_servizio_c: 4

note_critiche:
  - "Lagering lungo per profilo pulito"
  - "Mais e riso per corpo leggero"

alternative:
  - descrizione: "Versione più maltata"
    cambiamenti: "Sostituire il riso con Vienna"
    impatto: "Corpo leggermente più pieno"
